<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Objetivos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #f43f5e;
      color: white;
      padding: 16px 20px;
      text-align: center;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
    }

    .nav button {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #4f46e5;
      padding: 4px 10px;
    }

    .nav span {
      font-weight: 600;
      font-size: 1rem;
      color: #1e293b;
      text-transform: capitalize;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    .day-label {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #64748b;
      padding: 4px 0;
      text-transform: uppercase;
    }

    .day-cell {
      background: white;
      border-radius: 10px;
      padding: 6px 4px;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
      position: relative;
    }

    .day-cell:hover { border-color: #4f46e5; }

    .day-cell.empty { background: transparent; cursor: default; }

    .day-cell.today { border-color: #4f46e5; }

    .day-num {
      font-size: 0.7rem;
      font-weight: 600;
      color: #1e293b;
      position: absolute;
      top: 5px;
      left: 6px;
    }

    .day-cell.today .day-num {
      background: #4f46e5;
      color: white;
      border-radius: 50%;
      width: 15px;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      top: 5px;
      left: 5px;
      font-size: 0.6rem;
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      justify-content: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      color: #1e293b;
      text-transform: capitalize;
    }

    .modal-header button {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #64748b;
    }

    .habit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      border-left: 4px solid transparent;
    }

    .habit-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .habit-item label {
      font-size: 0.95rem;
      color: #1e293b;
      cursor: pointer;
      flex: 1;
      font-weight: 500;
    }

    .habit-item input[type="checkbox"]:checked ~ label {
      text-decoration: line-through;
      color: #94a3b8;
    }

    /* Añadir hábito */
    .add-habit {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .add-habit input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    .add-habit input:focus { border-color: #4f46e5; }

    .add-habit button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    .good-things-section {
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .good-thing-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .good-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .good-input {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.88rem;
      outline: none;
      font-family: inherit;
      color: #334155;
    }

    .good-input:focus { border-color: #4f46e5; }

    .day-note-icon {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      position: absolute;
      top: 6px;
      right: 6px;
    }

    .emoji-section {
      margin-bottom: 16px;
    }

    .emoji-label {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 8px;
    }

    .emoji-picker {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .emoji-picker span {
      cursor: pointer;
      border-radius: 10px;
      padding: 4px 4px;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .emoji-picker span:hover { transform: scale(1.1); }

    .emoji-picker span.selected {
      border-color: #f43f5e;
      background: #fff1f2;
    }

    .ei { font-size: 1.4rem; line-height: 1; }

    .el {
      font-size: 0.55rem;
      color: #64748b;
      text-align: center;
      line-height: 1;
      white-space: nowrap;
    }

    .day-emoji {
      font-size: 0.65rem;
      line-height: 1;
      position: absolute;
      bottom: 4px;
      right: 5px;
    }

    .summary {
      max-width: 480px;
      margin: 0 auto 24px;
      padding: 0 12px;
    }

    .summary h3 {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .summary-name {
      font-size: 0.82rem;
      color: #334155;
      width: 140px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary-bar-wrap {
      flex: 1;
      background: #e2e8f0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .summary-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .summary-count {
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    .daily-quote {
      max-width: 480px;
      margin: 0 auto 32px;
      padding: 14px 20px;
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      font-style: italic;
      border-top: 1px solid #e2e8f0;
    }

    .frase-dia {
      background: #f8fafc;
      border-left: 3px solid #f43f5e;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 0.82rem;
      color: #475569;
      font-style: italic;
      line-height: 1.5;
    }

    /* Gestionar hábitos */
    .manage-btn {
      display: block;
      margin: 0 auto 16px;
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: #64748b;
      cursor: pointer;
    }

    .delete-habit-btn {
      display: none;
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .managing .delete-habit-btn { display: block; }

  </style>
</head>
<body>

<header>
  <h1>Mis Objetivos</h1>
</header>

<div class="nav">
  <button id="prevMonth">&#8249;</button>
  <span id="monthLabel"></span>
  <button id="nextMonth">&#8250;</button>
</div>

<div class="calendar-grid" id="calendarGrid"></div>

<div class="summary" id="summary"></div>

<div class="daily-quote" id="dailyQuote"></div>

<!-- Modal día -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button id="closeModal">✕</button>
    </div>
    <div class="emoji-section">
      <p class="emoji-label">¿Cómo estás hoy?</p>
      <div class="emoji-picker" id="emojiPicker">
        <span data-emoji="🥳"><span class="ei">🥳</span><span class="el">Fiesta</span></span>

        <span data-emoji="🥰"><span class="ei">🥰</span><span class="el">Amor</span></span>
        <span data-emoji="😎"><span class="ei">😎</span><span class="el">Cool</span></span>
        <span data-emoji="🤩"><span class="ei">🤩</span><span class="el">Genial</span></span>
        <span data-emoji="🤗"><span class="ei">🤗</span><span class="el">Cariño</span></span>
        <span data-emoji="😇"><span class="ei">😇</span><span class="el">Paz</span></span>
        <span data-emoji="😅"><span class="ei">😅</span><span class="el">Alivio</span></span>

        <span data-emoji="😐"><span class="ei">😐</span><span class="el">Normal</span></span>

        <span data-emoji="😔"><span class="ei">😔</span><span class="el">Bajo</span></span>
        <span data-emoji="🥺"><span class="ei">🥺</span><span class="el">Triste</span></span>
        <span data-emoji="😢"><span class="ei">😢</span><span class="el">Llorar</span></span>
        <span data-emoji="😭"><span class="ei">😭</span><span class="el">Muy mal</span></span>
        <span data-emoji="😤"><span class="ei">😤</span><span class="el">Frustrado</span></span>
        <span data-emoji="😠"><span class="ei">😠</span><span class="el">Enfadado</span></span>

        <span data-emoji="🥴"><span class="ei">🥴</span><span class="el">Raro</span></span>
        <span data-emoji="😴"><span class="ei">😴</span><span class="el">Cansado</span></span>
      </div>
    </div>
    <div class="frase-dia" id="fraseDia"></div>
    <div id="habitList"></div>
    <button class="manage-btn" id="manageBtn">Gestionar objetivos</button>

      <input type="text" id="newHabitInput" placeholder="Añadir objetivo..." maxlength="60" />

      <p class="emoji-label">3 cosas buenas de hoy ✨</p>

      </div>
      <div class="good-thing-row">
        <span class="good-num">2</span>
        <input type="text" class="good-input" id="good2" placeholder="Algo bueno..." maxlength="80" />
      </div>
      <div class="good-thing-row">

        <input type="text" class="good-input" id="good3" placeholder="Algo bueno..." maxlength="80" />
      </div>
    </div>
  </div>
</div>

<script>
  const HABITS_KEY = 'mis_habitos';
  const DATA_KEY = 'mis_datos';

  const PALETTE = [
    '#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899',
    '#06b6d4', '#84cc16', '#f97316', '#6366f1', '#14b8a6', '#a855f7',
    '#e11d48', '#0ea5e9', '#d97706', '#7c3aed', '#059669', '#db2777',
    '#0891b2', '#65a30d'
  ];

  const DEFAULT_HABITS = [
    { name: 'Ejercicio',             color: PALETTE[0] },
    { name: 'Beber 2 litros de agua',color: PALETTE[1] },
    { name: 'Leer',                  color: PALETTE[2] },
    { name: 'Buscar trabajo',        color: PALETTE[3] },
    { name: 'No beber alcohol',      color: PALETTE[4] },
    { name: 'Página web Víctor',     color: PALETTE[5] },
  ];

  function getHabits() {
    const stored = localStorage.getItem(HABITS_KEY);
    if (!stored) return DEFAULT_HABITS.map(h => ({ ...h }));
    const parsed = JSON.parse(stored);
    // migrar formato antiguo (array de strings)
    return parsed.map((h, i) => typeof h === 'string'
      ? { name: h, color: PALETTE[i % PALETTE.length] }
      : h
    );
  }

  function saveHabits(habits) {
    localStorage.setItem(HABITS_KEY, JSON.stringify(habits));
  }

  function nextColor(habits) {
    return PALETTE[habits.length % PALETTE.length];
  }

  function getData() {
    try {
      const stored = localStorage.getItem(DATA_KEY);
      return stored ? JSON.parse(stored) : {};
    } catch(e) { return {}; }
  }

  function saveData(data) {
    try {
      localStorage.setItem(DATA_KEY, JSON.stringify(data));
    } catch(e) {}
  }

  const DAY_LABELS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  let currentYear, currentMonth, selectedDateKey;
  const today = new Date();

  function init() {
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    renderCalendar();
  }

  function renderSummary() {
    const habits = getHabits();
    const data = getData();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const el = document.getElementById('summary');

    const counts = habits.map(h => {
      let count = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if ((data[key] || {})[h.name]) count++;
      }
      return { ...h, count };
    }).filter(h => h.count > 0).sort((a, b) => b.count - a.count);

    if (counts.length === 0) { el.innerHTML = ''; return; }

    const max = counts[0].count;
    el.innerHTML = `<h3>Este mes</h3>` + counts.map(h => `
      <div class="summary-row">
        <span class="summary-name" title="${h.name}">${h.name}</span>
        <div class="summary-bar-wrap">
          <div class="summary-bar" style="width:${(h.count/max)*100}%;background:${h.color}"></div>
        </div>
        <span class="summary-count">${h.count}d</span>
      </div>
    `).join('');
  }

  function renderCalendar() {
    document.getElementById('monthLabel').textContent = `${MONTH_NAMES[currentMonth]} ${currentYear}`;
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    DAY_LABELS.forEach(l => {
      const div = document.createElement('div');
      div.className = 'day-label';
      div.textContent = l;
      grid.appendChild(div);
    });

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const offset = (firstDay === 0) ? 6 : firstDay - 1;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const data = getData();

    for (let i = 0; i < offset; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';

      const isToday = d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
      const isPast = new Date(currentYear, currentMonth, d) < new Date(today.getFullYear(), today.getMonth(), today.getDate());
      if (isToday) cell.classList.add('today');

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      cell.appendChild(numEl);

      const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayData = data[dateKey] || {};
      const habits = getHabits();
      const doneHabits = habits.filter(h => dayData[h.name]);

      if (isPast) {
        const doneCount = habits.filter(h => dayData[h.name]).length;
        cell.style.background = doneCount >= 3 ? '#dcfce7' : '#ffe4e6';
      }

      const good = dayData._good || [];
      if (good.filter(g => g).length === 3) {
        cell.style.outline = '2px solid #f59e0b';
        cell.style.outlineOffset = '-2px';
      }

      if (dayData._emoji) {
        const emojiEl = document.createElement('div');
        emojiEl.className = 'day-emoji';
        emojiEl.textContent = dayData._emoji;
        cell.appendChild(emojiEl);
      }

      if (doneHabits.length > 0) {
        const dots = document.createElement('div');
        dots.className = 'dots';
        doneHabits.forEach(h => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.style.background = h.color;
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      }

      cell.addEventListener('click', () => openModal(dateKey, d));
      grid.appendChild(cell);
    }
    renderSummary();
  }

  const FRASES = [
    "Cada día es una nueva oportunidad para ser mejor que ayer.",
    "El secreto para avanzar es empezar.",
    "No tienes que ser perfecto, solo tienes que intentarlo.",
    "Los pequeños pasos también cuentan.",
    "Cuídate hoy para estar bien mañana.",
    "Un día a la vez, un paso a la vez.",
    "Lo que haces hoy puede mejorar todos tus mañanas.",
    "El progreso, no la perfección, es el objetivo.",
    "Cada esfuerzo que haces te acerca a donde quieres estar.",
    "Tú puedes con esto.",
    "Hoy es un buen día para tener un buen día.",
    "La constancia supera al talento.",
    "No pasa nada si ayer no fue perfecto. Hoy es otro día.",
    "Pequeñas victorias, grandes cambios.",
    "Hazlo con calma, pero hazlo.",
    "Tu única competencia eres tú de ayer.",
    "Confía en el proceso.",
    "Mereces cuidarte tanto como cuidas a los demás.",
    "El mejor momento para empezar era antes. El segundo mejor es ahora.",
    "Sé amable contigo mismo.",
    "Un día menos perfecto sigue siendo un día.",
    "Lo importante no es la velocidad, sino no parar.",
    "Cada día que intentas algo cuenta.",
    "Respira. Estás haciendo lo que puedes.",
    "No necesitas motivación para empezar, necesitas empezar para tener motivación.",
    "Eres más fuerte de lo que crees.",
    "Las rutinas construyen el futuro.",
    "Date el crédito que mereces.",
    "El camino se hace al andar.",
    "Hoy también vale la pena."
  ];

  function getFrase(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const idx = (y * 366 + m * 31 + d) % FRASES.length;
    return FRASES[idx];
  }

  function openModal(dateKey, day) {
    selectedDateKey = dateKey;
    document.getElementById('modalTitle').textContent = `${day} de ${MONTH_NAMES[currentMonth]}`;
    document.getElementById('fraseDia').textContent = getFrase(dateKey);
    renderHabitList();
    renderEmojiPicker();
    renderGoodThings();
    document.getElementById('overlay').classList.add('open');
  }

  function renderGoodThings() {
    const data = getData();
    const things = (data[selectedDateKey] || {})._good || ['', '', ''];
    ['good1','good2','good3'].forEach((id, i) => {
      document.getElementById(id).value = things[i] || '';
    });
  }

  function saveGoodThings() {
    const vals = ['good1','good2','good3'].map(id => document.getElementById(id).value.trim());
    const data = getData();
    if (!data[selectedDateKey]) data[selectedDateKey] = {};
    data[selectedDateKey]._good = vals;
    saveData(data);
  }

  ['good1','good2','good3'].forEach(id => {
    document.getElementById(id).addEventListener('input', saveGoodThings);
  });

  function renderEmojiPicker() {
    const data = getData();
    const saved = (data[selectedDateKey] || {})._emoji || null;
    document.querySelectorAll('#emojiPicker span').forEach(el => {
      el.classList.toggle('selected', el.dataset.emoji === saved);
    });
  }

  document.getElementById('emojiPicker').addEventListener('click', e => {
    const span = e.target.closest('[data-emoji]');
    if (!span) return;
    const emoji = span.dataset.emoji;
    const data = getData();
    if (!data[selectedDateKey]) data[selectedDateKey] = {};
    if (data[selectedDateKey]._emoji === emoji) {
      delete data[selectedDateKey]._emoji;
    } else {
      data[selectedDateKey]._emoji = emoji;
    }
    saveData(data);
    renderEmojiPicker();
    renderCalendar();
  });

  function renderHabitList() {
    const habits = getHabits();
    const data = getData();
    const dayData = data[selectedDateKey] || {};
    const list = document.getElementById('habitList');
    list.innerHTML = '';

    habits.forEach(habit => {
      const item = document.createElement('div');
      item.className = 'habit-item';
      item.style.borderLeftColor = habit.color;
      item.style.background = habit.color + '15';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'h_' + habit.name;
      cb.checked = !!dayData[habit.name];
      cb.style.accentColor = habit.color;
      cb.addEventListener('change', () => toggleHabit(habit.name, cb.checked));

      const label = document.createElement('label');
      label.htmlFor = 'h_' + habit.name;
      label.textContent = habit.name;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-habit-btn';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => deleteHabit(habit.name));

      item.appendChild(cb);
      item.appendChild(label);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }

  function toggleHabit(habit, checked) {
    const data = getData();
    if (!data[selectedDateKey]) data[selectedDateKey] = {};
    data[selectedDateKey][habit] = checked;
    saveData(data);
    renderHabitList();
    renderCalendar();
  }

  function deleteHabit(name) {
    const habits = getHabits().filter(h => h.name !== name);
    saveHabits(habits);
    renderHabitList();
    renderCalendar();
  }

  document.getElementById('addHabitBtn').addEventListener('click', () => {
    const input = document.getElementById('newHabitInput');
    const val = input.value.trim();
    if (!val) return;
    const habits = getHabits();
    if (!habits.find(h => h.name === val)) {
      habits.push({ name: val, color: nextColor(habits) });
      saveHabits(habits);
    }
    input.value = '';
    renderHabitList();
  });

  document.getElementById('newHabitInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('addHabitBtn').click();
  });

  document.getElementById('manageBtn').addEventListener('click', () => {
    const list = document.getElementById('habitList');
    const managing = list.classList.toggle('managing');
    document.getElementById('manageBtn').textContent = managing ? 'Listo' : 'Gestionar objetivos';
  });

  document.getElementById('closeModal').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('habitList').classList.remove('managing');
    document.getElementById('manageBtn').textContent = 'Gestionar objetivos';
    renderCalendar();
  });

  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('overlay')) {
      document.getElementById('overlay').classList.remove('open');
    }
  });

  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  });

  const QUOTES = [
    'Cada día es una nueva oportunidad para ser mejor.',
    'El progreso, no la perfección.',
    'Un paso pequeño sigue siendo un paso adelante.',
    'Lo que haces hoy puede mejorar todos tus mañanas.',
    'No tienes que ser perfecta, solo tienes que intentarlo.',
    'La constancia es más poderosa que la intensidad.',
    'Cuídate como cuidarías a alguien que quieres.',
    'Los buenos hábitos son la base de una buena vida.',
    'Date el mérito de seguir adelante.',
    'Hoy es un buen día para tener un buen día.',
    'Pequeños pasos, grandes cambios.',
    'Confía en el proceso.',
    'El esfuerzo de hoy es el resultado de mañana.',
    'No te compares con nadie, solo con quien eras ayer.',
    'Mereces el tiempo que te dedicas a ti misma.',
    'La disciplina es quererte lo suficiente.',
    'Cada objetivo cumplido es una victoria.',
    'Tu bienestar importa.',
    'Empieza donde estás, usa lo que tienes, haz lo que puedas.',
    'Lo más difícil es empezar. Ya lo has hecho.',
    'Los días malos también pasan.',
    'Eres más fuerte de lo que crees.',
    'Celebra los pequeños logros.',
    'La vida mejora cuando tú decides mejorarla.',
    'Haz hoy algo que tu yo del futuro te agradezca.',
    'No hay prisa, pero sí hay dirección.',
    'El descanso también es parte del camino.',
    'Una cosa a la vez.',
    'Eres suficiente.',
    'Cada día que intentas cuenta.'
  ];

  function renderQuote() {
    const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
    const quote = QUOTES[dayOfYear % QUOTES.length];
    document.getElementById('dailyQuote').textContent = `"${quote}"`;
  }

  init();
  renderQuote();
</script>
</body>
</html>
